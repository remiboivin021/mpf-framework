site_name: Modular Project Framework (MPF)
site_description: Industrial-grade framework for structuring complex robotics software systems
site_author: MPF Contributors
site_url: https://remiboivin021.github.io/mpf-framework/

repo_name: remiboivin021/mpf-framework
repo_url: https://github.com/remiboivin021/mpf-framework

theme:
  name: material
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotation
    - content.code.copy
  language: en

nav:
  - Home: index.md
  - Engineering:
      - Best Practices:
          - Engineering Principles: engineering/best_practices/concepts.md
          - Git Conventions: engineering/best_practices/git.md

# Exclude README.md from the docs directory (it's for GitHub, not the built site)
exclude_docs: |
  README.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.mark
  - attr_list
  - md_in_html
  - tables

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/remiboivin021/mpf-framework

copyright: Copyright &copy; 2024-2026 MPF Contributors
